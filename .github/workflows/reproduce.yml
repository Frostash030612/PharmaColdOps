name: Pinned clean-checkout reproduction
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      neo4j:
        image: neo4j@sha256:d9cfe82983d27f5a75b3aaae8f316d04f9a698a3b7f6103a508f7caf8362f255
        env:
          # Disposable CI credential, never a deployment password.
          NEO4J_AUTH: neo4j/ci-reproduction-only
          NEO4J_server_memory_heap_initial__size: 128m
          NEO4J_server_memory_heap_max__size: 256m
          NEO4J_server_memory_pagecache_size: 64m
        ports:
          - 17697:7687
        options: >-
          --memory=768m
          --health-cmd="cypher-shell -u neo4j -p ci-reproduction-only 'RETURN 1'"
          --health-interval=10s --health-timeout=10s --health-retries=12 --health-start-period=30s
    env:
      NEO4J_URI: bolt://127.0.0.1:17697
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-reproduction-only
      KG_SYNC_ENABLED: "0"
      LOKY_MAX_CPU_COUNT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: python -m pip install -r requirements-eval.lock.txt
      - run: python -m pip check
      - run: npm install --global pnpm@12.4.1
      - run: python scripts/check_reproduction.py --frontend --report data/processed/ci-environment.json
      # This graph is a new CI-only service, never the project's persistent graph.
      - run: python -m src.knowledge_graph.build_graph
      - run: python -m pytest -q
      - run: pnpm --dir frontend-vue install --frozen-lockfile
      - run: pnpm --dir frontend-vue build
      - run: python scripts/run_demo_acceptance.py --graph --output data/processed/ci-demo
      - run: python scripts/verify_deployment.py --build --output data/processed/ci-deployment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-evidence
          # Never upload generated env/password files or runtime case databases.
          path: |
            data/processed/ci-environment.json
            data/processed/ci-demo/report.json
            data/processed/ci-deployment/report.json
            data/processed/ci-deployment/compose.log
