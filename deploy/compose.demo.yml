name: pharmacoldops-demo
services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j@sha256:d9cfe82983d27f5a75b3aaae8f316d04f9a698a3b7f6103a508f7caf8362f255}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set a unique password in deploy/demo.env}
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD:?Set a unique password}
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 64m
    mem_limit: 768m
    volumes:
      - graph_data:/data
      - graph_logs:/logs
    healthcheck:
      test: [CMD-SHELL, 'cypher-shell -u neo4j -p "$$HEALTHCHECK_PASSWORD" "RETURN 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
  api:
    image: ${DEMO_IMAGE:-pharmacoldops-demo:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    ports:
      - ${DEMO_BIND_ADDRESS:-127.0.0.1}:${DEMO_PORT:-8080}:8000
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set a unique password}
      DATABASE_URL: /runtime/audit/dispatch.sqlite3
      CASE_RUNS_FILE: /runtime/audit/runs.jsonl
      ML_MODEL_DIR: /app/models
      FRONTEND_DIST: /app/frontend-dist
      CORS_ORIGINS: ""
      KG_SYNC_ENABLED: "1"
      DEPLOYMENT_REQUIRE_GRAPH: "1"
      DEPLOYMENT_REQUIRE_MODELS: "1"
    volumes:
      - audit_data:/runtime/audit
    depends_on:
      neo4j:
        condition: service_healthy
    command: [sh, -c, 'python scripts/bootstrap_demo.py && exec python -m uvicorn --app-dir src api.main:app --host 0.0.0.0 --port 8000 --workers 1']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready',timeout=10).read()"]
      interval: 15s
      timeout: 15s
      retries: 8
      start_period: 90s
    security_opt:
      - no-new-privileges:true
volumes:
  audit_data:
  graph_data:
  graph_logs:
