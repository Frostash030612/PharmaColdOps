  <text x="80" y="96" font-size="15" font-weight="700" fill="#2F855A">Presentation</text>
  <g>
    <rect x="230" y="112" width="120" height="30" rx="8" fill="#FFFFFF" stroke="#2F855A"/>
    <rect x="362" y="112" width="120" height="30" rx="8" fill="#FFFFFF" stroke="#2F855A"/>
    <rect x="494" y="112" width="120" height="30" rx="8" fill="#FFFFFF" stroke="#2F855A"/>
    <rect x="626" y="112" width="120" height="30" rx="8" fill="#FFFFFF" stroke="#2F855A"/>
