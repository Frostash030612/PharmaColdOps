    <rect x="440" y="412" width="190" height="30" rx="8" fill="#FFFFFF" stroke="#2B6CB0"/>
    <rect x="650" y="412" width="190" height="30" rx="8" fill="#FFFFFF" stroke="#2B6CB0"/>
    <rect x="230" y="450" width="190" height="30" rx="8" fill="#FFFFFF" stroke="#2B6CB0"/>
    <rect x="440" y="450" width="190" height="30" rx="8" fill="#FFFFFF" stroke="#2B6CB0"/>
    <text x="325" y="432" text-anchor="middle" font-size="11.5" fill="#2D3748">Anomaly detection</text>
    <text x="535" y="432" text-anchor="middle" font-size="11.5" fill="#2D3748">Risk prediction</text>
    <text x="745" y="432" text-anchor="middle" font-size="11.5" fill="#2D3748">Rule engine</text>
    <text x="325" y="470" text-anchor="middle" font-size="11.5" fill="#2D3748">Root-cause classification</text>
    <text x="535" y="470" text-anchor="middle" font-size="11.5" fill="#2D3748">Route optimisation</text>
