    <text x="818" y="132" text-anchor="middle" font-size="11.5" fill="#2D3748">Compliance Q&amp;A</text>
  </g>

  <line x1="480" y1="186" x2="480" y2="216" stroke="#4A5568" stroke-width="2" marker-end="url(#arrUp)"/>

