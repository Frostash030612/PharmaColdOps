  <g>
    <rect x="230" y="562" width="190" height="30" rx="8" fill="#FFFFFF" stroke="#4A5568"/>
    <rect x="440" y="562" width="190" height="30" rx="8" fill="#FFFFFF" stroke="#4A5568"/>
    <rect x="650" y="562" width="190" height="30" rx="8" fill="#FFFFFF" stroke="#4A5568"/>
    <rect x="230" y="600" width="190" height="30" rx="8" fill="#FFFFFF" stroke="#4A5568"/>
    <rect x="440" y="600" width="190" height="30" rx="8" fill="#FFFFFF" stroke="#4A5568"/>
    <rect x="650" y="600" width="190" height="30" rx="8" fill="#FFFFFF" stroke="#4A5568"/>
    <text x="325" y="582" text-anchor="middle" font-size="11.5" fill="#2D3748">Temperature logs</text>
    <text x="535" y="582" text-anchor="middle" font-size="11.5" fill="#2D3748">GPS traces</text>
    <text x="745" y="582" text-anchor="middle" font-size="11.5" fill="#2D3748">Order data</text>
    <text x="325" y="620" text-anchor="middle" font-size="11.5" fill="#2D3748">Inventory data</text>
    <text x="535" y="620" text-anchor="middle" font-size="11.5" fill="#2D3748">Vehicle info</text>
    <text x="745" y="620" text-anchor="middle" font-size="11.5" fill="#2D3748">Stability parameters</text>
