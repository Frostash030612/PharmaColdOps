  <rect x="60" y="216" width="840" height="120" rx="12" fill="#E6FFFA" stroke="#2C7A7B" stroke-width="2"/>
  <text x="80" y="246" font-size="15" font-weight="700" fill="#2C7A7B">Knowledge &amp; Explanation</text>
  <g>
    <rect x="230" y="262" width="150" height="30" rx="8" fill="#FFFFFF" stroke="#2C7A7B"/>
    <rect x="400" y="262" width="150" height="30" rx="8" fill="#FFFFFF" stroke="#2C7A7B"/>
    <rect x="570" y="262" width="150" height="30" rx="8" fill="#FFFFFF" stroke="#2C7A7B"/>
