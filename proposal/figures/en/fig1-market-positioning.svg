<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Decision support capabilities and project scope">
  <rect width="960" height="540" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
  <text x="40" y="42" font-size="24" font-weight="700" fill="#202b33">Decision support capabilities and project scope</text>
  <text x="40" y="80" font-size="16" fill="#33414b">Verified example and research scope as of 2026-09-12</text>
  <rect x="40" y="108" width="880" height="42" fill="#e8edf0"/>
  <text x="56" y="135" font-size="17" fill="#202b33" font-weight="700">Capability</text>
  <text x="300" y="135" font-size="17" fill="#202b33" font-weight="700">Commercial example</text>
  <text x="620" y="135" font-size="17" fill="#202b33" font-weight="700">PharmaColdOps</text>
  <text x="56" y="182" font-size="16" fill="#33414b">Quality release</text>
  <text x="300" y="182" font-size="16" fill="#33414b">Controlant describes stability</text>
  <text x="620" y="182" font-size="16" fill="#33414b">Configurable rule prototype</text>
  <text x="56" y="207" font-size="16" fill="#33414b"/>
  <text x="300" y="207" font-size="16" fill="#33414b">profile automation</text>
  <text x="620" y="207" font-size="16" fill="#33414b">with explicit assumptions</text>
  <text x="56" y="258" font-size="16" fill="#33414b">Delivery planning</text>
  <text x="300" y="258" font-size="16" fill="#33414b">Not assessed in this review</text>
  <text x="620" y="258" font-size="16" fill="#33414b">Greedy and Routing Solver</text>
  <text x="56" y="283" font-size="16" fill="#33414b"/>
  <text x="300" y="283" font-size="16" fill="#33414b"/>
  <text x="620" y="283" font-size="16" fill="#33414b">Event integration pending</text>
  <text x="56" y="334" font-size="16" fill="#33414b">Evidence</text>
  <text x="300" y="334" font-size="16" fill="#33414b">Vendor capabilities require</text>
  <text x="620" y="334" font-size="16" fill="#33414b">Stored case and source links</text>
  <text x="56" y="359" font-size="16" fill="#33414b"/>
  <text x="300" y="359" font-size="16" fill="#33414b">product-specific verification</text>
  <text x="620" y="359" font-size="16" fill="#33414b">Frontend queries pending</text>
  <text x="56" y="410" font-size="16" fill="#33414b">Validation</text>
