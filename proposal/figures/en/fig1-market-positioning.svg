<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C53030"/>
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1A202C">Cold-Chain Market Positioning Matrix</text>

  <!-- quadrants -->
  <rect x="110" y="60" width="350" height="205" rx="12" fill="#FDF6EC"/>
  <rect x="460" y="60" width="350" height="205" rx="12" fill="#F0FFF4"/>
  <rect x="110" y="265" width="350" height="205" rx="12" fill="#F7FAFC"/>
  <rect x="460" y="265" width="350" height="205" rx="12" fill="#EBF4FF"/>

  <text x="126" y="86" font-size="13.5" font-weight="600" fill="#B7791F">Bespoke consultancy (manual experts)</text>
  <text x="476" y="86" font-size="13.5" font-weight="600" fill="#276749">Opportunity zone: automated decision layer</text>
  <text x="126" y="291" font-size="13.5" font-weight="600" fill="#718096">Manual record-keeping (Excel logs)</text>
  <text x="476" y="291" font-size="13.5" font-weight="600" fill="#2B6CB0">Commodity temperature monitoring (alert-only)</text>

  <!-- consultancy -->
  <circle cx="205" cy="150" r="7" fill="#C05621"/>
  <text x="220" y="150" font-size="12.5" fill="#4A5568">Consulting / custom projects</text>
  <text x="220" y="167" font-size="11" fill="#718096">(high cost · hard to scale)</text>

  <!-- manual -->
  <circle cx="200" cy="390" r="7" fill="#718096"/>
  <text x="215" y="390" font-size="12.5" fill="#4A5568">Data loggers · Excel logs</text>
  <text x="215" y="407" font-size="11" fill="#718096">(record only · no decision)</text>

  <!-- monitoring vendors -->
  <circle cx="575" cy="375" r="7" fill="#2B6CB0"/>
  <text x="590" y="371" font-size="12.5" fill="#4A5568">Controlant · Elpro · Sensitech</text>
  <text x="590" y="389" font-size="12.5" fill="#4A5568">Tive · Roambee · Berlinger · Envirotainer</text>

  <!-- PharmaColdOps -->
  <polygon points="700,118 704,126 713,126 707,132 709,141 700,136 691,141 693,132 687,126 696,126" fill="#2F855A"/>
  <text x="716" y="126" font-size="15" font-weight="700" fill="#2F855A">PharmaColdOps</text>
  <text x="716" y="144" font-size="11" fill="#276749">automated · explainable · disposition + re-routing</text>

  <!-- evolution arrow -->
  <path d="M 240 440 C 380 380 500 250 670 145" fill="none" stroke="#C53030" stroke-width="2" stroke-dasharray="6,6" marker-end="url(#arrRed)"/>
  <text x="420" y="355" font-size="11.5" fill="#C53030">evolution path</text>

  <!-- axes -->
  <line x1="110" y1="470" x2="822" y2="470" stroke="#4A5568" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="110" y1="470" x2="110" y2="52" stroke="#4A5568" stroke-width="2" marker-end="url(#arrGray)"/>

  <text x="460" y="502" text-anchor="middle" font-size="13" font-weight="700" fill="#1A202C">Automation level (low → high)</text>
  <text x="130" y="500" font-size="11" fill="#718096">low</text>
  <text x="800" y="500" font-size="11" fill="#718096">high</text>

  <text x="52" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="#1A202C" transform="rotate(-90 52 265)">Decision &amp; integration depth</text>
  <text x="46" y="452" text-anchor="middle" font-size="10.5" fill="#718096" transform="rotate(-90 46 452)">alert / record only</text>
  <text x="46" y="100" text-anchor="middle" font-size="10.5" fill="#718096" transform="rotate(-90 46 100)">disposition + re-routing</text>
</svg>
