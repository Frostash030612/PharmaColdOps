  <text x="620" y="410" font-size="16" fill="#33414b">57 human-labelled cases</text>
  <text x="56" y="435" font-size="16" fill="#33414b"/>
  <text x="300" y="435" font-size="16" fill="#33414b"/>
  <text x="620" y="435" font-size="16" fill="#33414b">Public data and simulated orders</text>
  <text x="40" y="490" font-size="14" fill="#596771">Source: controlant.com/applications. Unknown capabilities are not treated as absent.</text>
  <text x="40" y="516" font-size="14" fill="#596771">This is a scope comparison, not a market ranking or proof of commercial superiority.</text>
