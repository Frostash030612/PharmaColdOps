<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Four dispositions and a separate reshipment action">
  <rect width="960" height="650" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
  <text x="40" y="42" font-size="24" font-weight="700" fill="#202b33">Four dispositions and a separate reshipment action</text>
  <rect x="40" y="78" width="880" height="95" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="56" y="106" font-size="18" fill="#202b33" font-weight="700">Inputs and product configuration</text>
  <text x="56" y="133" font-size="15" fill="#33414b">Category, temperature, duration, MKT and packaging</text>
  <text x="56" y="156" font-size="15" fill="#33414b">Stage is recorded only. Numeric limits include prototype assumptions.</text>
  <line x1="480" y1="173" x2="480" y2="205" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="160" y="205" width="640" height="110" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="176" y="233" font-size="18" fill="#202b33" font-weight="700">Deterministic rules: first match wins</text>
  <text x="176" y="260" font-size="15" fill="#33414b">Freeze / packaging / severe limits / ordinary limits / near limits / default</text>
  <text x="176" y="283" font-size="15" fill="#33414b">Python defines semantics. Offline JS mirrors the same rules.</text>
  <line x1="480" y1="315" x2="480" y2="344" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="145" y1="344" x2="820" y2="344" stroke="#52606d" stroke-width="2"/>
  <line x1="145" y1="344" x2="145" y2="362" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="362" width="205" height="65" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="56" y="390" font-size="18" fill="#202b33" font-weight="700">Release</text>
  <line x1="370" y1="344" x2="370" y2="362" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="265" y="362" width="205" height="65" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="281" y="390" font-size="18" fill="#202b33" font-weight="700">Retest</text>
  <line x1="595" y1="344" x2="595" y2="362" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="490" y="362" width="205" height="65" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="506" y="390" font-size="18" fill="#202b33" font-weight="700">Quarantine</text>
  <line x1="820" y1="344" x2="820" y2="362" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="715" y="362" width="205" height="65" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="731" y="390" font-size="18" fill="#202b33" font-weight="700">Scrap</text>
  <rect x="40" y="466" width="415" height="75" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="56" y="494" font-size="18" fill="#202b33" font-weight="700">Reshipment flag = false</text>
  <text x="56" y="521" font-size="15" fill="#33414b">Current default: release or retest</text>
  <rect x="490" y="466" width="430" height="75" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="506" y="494" font-size="18" fill="#202b33" font-weight="700">Reshipment flag = true</text>
  <text x="506" y="521" font-size="15" fill="#33414b">Current default: quarantine or scrap</text>
  <path d="M145 427 V447 H370 V427 M248 447 V466" fill="none" stroke="#52606d" stroke-width="2"/>
  <path d="M595 427 V447 H820 V427 M705 447 V466" fill="none" stroke="#52606d" stroke-width="2"/>
  <text x="40" y="585" font-size="14" fill="#596771">Each result includes a rule number, reason and input/specification snapshot.</text>
  <text x="40" y="614" font-size="14" fill="#596771">Quality review is required. Flags are logistics defaults, not executed replacement orders.</text>
</svg>
