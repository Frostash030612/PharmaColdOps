<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Minimal integrated workflow targeted for W3">
  <rect width="960" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
  <text x="40" y="42" font-size="24" font-weight="700" fill="#202b33">Minimal integrated workflow targeted for W3</text>
  <rect x="80" y="80" width="800" height="66" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="96" y="108" font-size="18" fill="#202b33" font-weight="700">1  Enter a temperature event</text>
  <text x="96" y="135" font-size="15" fill="#33414b">Form/demo input exists; sequence extraction is supplementary</text>
  <line x1="480" y1="146" x2="480" y2="167" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="167" width="800" height="66" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="96" y="195" font-size="18" fill="#202b33" font-weight="700">2  Compute a rule recommendation</text>
  <text x="96" y="222" font-size="15" fill="#33414b">Four dispositions, reshipment flag and evidence states exist</text>
  <line x1="480" y1="233" x2="480" y2="254" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="254" width="800" height="66" rx="5" fill="#fff8ed" stroke="#a66c19" stroke-dasharray="6 4"/>
  <text x="96" y="282" font-size="18" fill="#202b33" font-weight="700">3  Review and close the case</text>
  <text x="96" y="309" font-size="15" fill="#33414b">Closure exists; final human outcome and approval fields are pending</text>
  <line x1="480" y1="320" x2="480" y2="341" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="341" width="800" height="66" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="96" y="369" font-size="18" fill="#202b33" font-weight="700">4  Build order and solve a route</text>
  <text x="96" y="396" font-size="15" fill="#33414b">Single-depot order mapping and event-triggered solving are wired (2026-09-12)</text>
  <line x1="480" y1="407" x2="480" y2="428" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="428" width="800" height="66" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="96" y="456" font-size="18" fill="#202b33" font-weight="700">5  Link results and query evidence</text>
  <text x="96" y="483" font-size="15" fill="#33414b">run/order/route IDs are associated; graph answers reach the frontend</text>
  <text x="40" y="554" font-size="14" fill="#596771">Acceptance: replacement, no replacement, infeasible route, missing evidence and service failure.</text>
  <text x="40" y="584" font-size="14" fill="#596771">Offline ML experiments support the report. Case closure is not automatic model learning.</text>
</svg>
