<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Knowledge graph concepts and case-writing boundary">
  <rect width="960" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
  <text x="40" y="42" font-size="24" font-weight="700" fill="#202b33">Knowledge graph concepts and case-writing boundary</text>
  <rect x="40" y="80" width="430" height="96" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="56" y="108" font-size="18" fill="#202b33" font-weight="700">Static sources</text>
  <text x="56" y="135" font-size="15" fill="#33414b">Product, Regulation and public-guidance SOP</text>
  <text x="56" y="158" font-size="15" fill="#33414b">Each source retains its scope and limitations</text>
  <rect x="490" y="80" width="430" height="96" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="506" y="108" font-size="18" fill="#202b33" font-weight="700">Other source records</text>
  <text x="506" y="135" font-size="15" fill="#33414b">Facility and Shipment</text>
  <text x="506" y="158" font-size="15" fill="#33414b">Anonymous shipments are not Singapore orders</text>
  <line x1="255" y1="176" x2="255" y2="228" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="705" y1="176" x2="705" y2="228" stroke="#52606d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="180" y="228" width="600" height="100" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="196" y="256" font-size="18" fill="#202b33" font-weight="700">ExcursionEvent keyed by run_id</text>
  <text x="196" y="283" font-size="15" fill="#33414b">case_close writes a case; decide previews do not</text>
  <text x="196" y="306" font-size="15" fill="#33414b">Facility/shipment associations require input identifiers</text>
  <line x1="300" y1="328" x2="170" y2="387" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="328" x2="480" y2="387" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="328" x2="790" y2="387" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="387" width="270" height="95" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="56" y="415" font-size="18" fill="#202b33" font-weight="700">Disposition</text>
  <text x="56" y="442" font-size="15" fill="#33414b">Four shared concepts</text>
  <text x="56" y="465" font-size="15" fill="#33414b">Case facts on relation</text>
  <rect x="345" y="387" width="270" height="95" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="361" y="415" font-size="18" fill="#202b33" font-weight="700">Cause</text>
  <text x="361" y="442" font-size="15" fill="#33414b">Heuristic API code</text>
  <text x="361" y="465" font-size="15" fill="#33414b">Not an investigated cause</text>
  <rect x="650" y="387" width="270" height="95" rx="5" fill="#f0f7f6" stroke="#397d73"/>
  <text x="666" y="415" font-size="18" fill="#202b33" font-weight="700">ReshipmentOrder</text>
  <text x="666" y="442" font-size="15" fill="#33414b">Created when flagged</text>
  <text x="666" y="465" font-size="15" fill="#33414b">Linked to route solving</text>
  <text x="40" y="538" font-size="14" fill="#596771">Case explanations query Regulation and SOP evidence from the graph.</text>
  <text x="40" y="567" font-size="14" fill="#596771">Graph writing is best-effort. The frontend queries the graph live.</text>
  <text x="40" y="596" font-size="14" fill="#596771">Remaining: the case-close form does not send facility ids yet.</text>
</svg>
